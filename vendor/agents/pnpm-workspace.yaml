packages:
  - "packages/*"
linkWorkspacePackages: true
preferWorkspacePackages: true
overrides:
  # Security fixes stay within each installed major; see ../../docs/dependency-security.md.
  "sharp@0.35.2": "0.35.4"
  "undici@>=7 <7.29.1": "7.29.1"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
  "fast-uri@>=3 <3.1.8": "3.1.8"
  "ip-address@>=10 <10.7.1": "10.7.1"
  "ws@>=8 <8.21.0": "8.21.0"
  "hono@>=4 <4.13.7": "4.13.7"
  "@hono/node-server@>=1 <1.19.15": "1.19.15"
  "qs@>=6 <6.16.0": "6.16.0"
  "@babel/core": "7.29.7"
peerDependencyRules:
  allowedVersions:
    # Agents' Vite plugin still calls Babel 7 APIs while its decorator plugin
    # declares only Babel 8. The maintained browser suite exercises this pair.
    "@babel/core": "^7.29.0"
    # The maintained fork typechecks against this Workers contract.
    "@cloudflare/workers-types": "5.20261009.1"
patchedDependencies:
  vitest-browser-react@2.3.0: patches/vitest-browser-react+2.3.0.patch
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
  msw: false
  # @opencode/sdk's local-host deps (file watcher, msgpack, shell parsers);
  # the workerd profile stubs them, so their native builds are not needed.
  "@parcel/watcher": false
  msgpackr-extract: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - "@typescript/*"
  - "@opencode/*"
  - workerd@1.20260722.1
  - miniflare@4.20260722.1
  - wrangler@4.115.0
  - workers-ai-provider@3.2.1 || 3.3.0 || 4.0.0
  - "@types/node@26.0.1"
  - nanoid@5.1.16
  - postal-mime@2.7.5
  - cronstrue@3.23.0
  - es-module-lexer@2.2.0
  - "@modelcontextprotocol/core@2.0.0"
  - "@modelcontextprotocol/server@2.0.0"
  - "@modelcontextprotocol/client@2.0.0"
  - "@modelcontextprotocol/conformance@0.2.0-alpha.10"
  - "@modelcontextprotocol/sdk@1.30.0"
