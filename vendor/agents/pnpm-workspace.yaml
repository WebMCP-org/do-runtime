packages:
  - "packages/*"
linkWorkspacePackages: true
preferWorkspacePackages: true
overrides:
  "@babel/core": "7.29.7"
peerDependencyRules:
  allowedVersions:
    # Agents' Vite plugin still calls Babel 7 APIs while its decorator plugin
    # declares only Babel 8. The maintained browser suite exercises this pair.
    "@babel/core": "^7.29.0"
    # The 0.22 source pin typechecks against this Workers contract.
    "@cloudflare/workers-types": "5.20260729.1"
    # Think supports AI SDK 6 and 7; Chat's stale peer range names only 6.
    ai: "^7.0.0"
patchedDependencies:
  vitest-browser-react@2.2.0: patches/vitest-browser-react+2.2.0.patch
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - "@typescript/*"
  - workerd@1.20260722.1
  - miniflare@4.20260722.1
  - wrangler@4.115.0
  - workers-ai-provider@3.2.1 || 3.3.0 || 4.0.0
  - "@types/node@26.0.1"
  - nanoid@5.1.16
  - postal-mime@2.7.5
  - cronstrue@3.23.0
  - es-module-lexer@2.2.0
  - "@modelcontextprotocol/core@2.0.0"
  - "@modelcontextprotocol/server@2.0.0"
  - "@modelcontextprotocol/client@2.0.0"
  - "@modelcontextprotocol/conformance@0.2.0-alpha.10"
  - "@modelcontextprotocol/sdk@1.30.0"
