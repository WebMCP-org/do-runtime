name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check workerd oracle pin
        run: pnpm check:oracle

      - name: Typecheck
        run: pnpm typecheck

      - name: Test unit suite
        run: pnpm test:unit

      - name: Test workerd conformance
        run: pnpm test:conformance-workerd

      - name: Test Node conformance
        run: pnpm test:conformance-node

      - name: Test browser conformance
        run: pnpm test:conformance-browser

      - name: Build examples
        run: pnpm examples:build

      - name: Test examples
        run: pnpm test:examples

      - name: Validate package tarball
        run: pnpm check:package
