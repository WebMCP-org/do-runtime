# The runtime lives at the root; runnable examples are workspace packages.
packages:
  - "."
  - "examples/*"
allowBuilds:
  workerd: true
  esbuild: true
  core-js-pure: false
# The pinned Aug 20 oracle is newer than the repository's release-age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260820.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260820.1"
  - "@cloudflare/workerd-linux-64@1.20260820.1"
  - "@cloudflare/workerd-linux-arm64@1.20260820.1"
  - "@cloudflare/workerd-windows-64@1.20260820.1"
  - "workerd@1.20260820.1"
  - "@mcp-b/design-tokens@0.46.3"
  - "@mcp-b/interactive-components@0.2.16"
  - "@mcp-b/react-components@0.46.3"
  - "@mcp-b/wc-support@0.2.13"
  - "@mcp-b/web-components@0.2.16"
