# The runtime lives at the root; runnable examples are workspace packages.
packages:
  - "."
  - "examples/*"
allowBuilds:
  workerd: true
  esbuild: true
  core-js-pure: false
  # Optional just-bash compression accelerators; the browser probe does not use them.
  "@mongodb-js/zstd": false
  node-liblzma: false
# Allow the pinned oracle through the repository's release-age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20261009.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261009.1"
  - "@cloudflare/workerd-linux-64@1.20261009.1"
  - "@cloudflare/workerd-linux-arm64@1.20261009.1"
  - "@cloudflare/workerd-windows-64@1.20261009.1"
  - "workerd@1.20261009.1"
  - "@cloudflare/workers-types@5.20261009.1"
overrides:
  # Security fixes stay within each installed major; see docs/dependency-security.md.
  "sharp@0.35.2": "0.35.4"
  "undici@>=7 <7.29.1": "7.29.1"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
  "fast-uri@>=3 <3.1.8": "3.1.8"
  "ip-address@>=10 <10.7.1": "10.7.1"
