<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vibe platform — a Durable Object in a page</title>
    <style>
      :root {
        color-scheme: light dark;
        --edge: color-mix(in oklab, currentColor 15%, transparent);
        --muted: color-mix(in oklab, currentColor 55%, transparent);
        --panel: color-mix(in oklab, canvas 92%, canvastext);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      header {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--edge);
      }
      header h1 {
        font-size: 13px;
        margin: 0 0.5rem 0 0;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .spacer {
        flex: 1;
      }
      #status {
        color: var(--muted);
      }
      button {
        font: inherit;
        padding: 0.25rem 0.75rem;
        border: 1px solid var(--edge);
        border-radius: 0.25rem;
        background: var(--panel);
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: currentColor;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #banner {
        margin: 0;
        padding: 0.75rem;
        background: #fde7e7;
        color: #7a1c1c;
        border-bottom: 1px solid #f0b8b8;
      }
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 15rem minmax(18rem, 2fr) 3fr;
        grid-template-rows: 1fr 10rem;
      }
      #files {
        grid-row: 1 / 3;
        border-right: 1px solid var(--edge);
        overflow: auto;
        padding: 0.5rem 0;
      }
      #files button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 0;
        background: none;
        padding: 0.2rem 0.75rem;
      }
      #files button[aria-current="true"] {
        background: var(--panel);
        font-weight: 700;
      }
      #editor {
        grid-row: 1 / 3;
        border: 0;
        border-right: 1px solid var(--edge);
        padding: 0.75rem;
        font: inherit;
        tab-size: 2;
        resize: none;
        background: none;
        color: inherit;
      }
      #preview {
        border: 0;
        width: 100%;
        height: 100%;
        background: white;
      }
      #log {
        margin: 0;
        padding: 0.5rem 0.75rem;
        overflow: auto;
        border-top: 1px solid var(--edge);
        white-space: pre-wrap;
        color: var(--muted);
      }
      #log .err {
        color: #d33c3c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>vibe platform</h1>
      <button id="save">save</button>
      <button id="build">build &amp; run</button>
      <span class="spacer"></span>
      <span id="status">booting…</span>
    </header>
    <p id="banner" hidden></p>
    <main>
      <nav id="files" aria-label="workspace files"></nav>
      <textarea id="editor" spellcheck="false" aria-label="file contents"></textarea>
      <iframe id="preview" title="preview" sandbox="allow-scripts"></iframe>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
