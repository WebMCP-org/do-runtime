<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">A durable Agent running inside a Chrome extension</title>
  <desc id="description">An Agent at the center of a Chrome extension, connected to persistent state, alarms, and live connections, with a sleep, wake, continue loop.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="0.55" stop-color="#f5f7ff" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <filter id="soft-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#312e81" flood-opacity="0.14" />
    </filter>
    <filter id="agent-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4338ca" flood-opacity="0.32" />
    </filter>
    <style>
      .heading { fill: #111827; font: 720 36px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.9px; }
      .eyebrow { fill: #4f46e5; font: 750 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
      .label { fill: #1e293b; font: 680 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #64748b; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Chromium window -->
  <rect x="1" y="1" width="1398" height="718" rx="23" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <path d="M24 1 H1376 A23 23 0 0 1 1399 24 V47 H1 V24 A23 23 0 0 1 24 1Z" fill="#dfe3e8" />
  <circle cx="28" cy="24" r="6" fill="#ef6a67" />
  <circle cx="50" cy="24" r="6" fill="#e7b84b" />
  <circle cx="72" cy="24" r="6" fill="#56b870" />
  <path d="M112 8 H336 A14 14 0 0 1 350 22 V47 H98 V22 A14 14 0 0 1 112 8Z" fill="#ffffff" />
  <rect x="116" y="17" width="20" height="20" rx="6" fill="#4f46e5" />
  <path d="M121 27 H131 M126 22 V32" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
  <text x="146" y="33" class="small">do-runtime</text>
  <path d="M331 22 339 30 M339 22 331 30" stroke="#94a3b8" stroke-width="1.4" />

  <rect x="1" y="47" width="1398" height="51" fill="#ffffff" />
  <path d="M30 72 H48 M30 72 38 64 M30 72 38 80" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M72 72 H90 M90 72 82 64 M90 72 82 80" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M126 64 A11 11 0 1 0 130 78 M126 64 132 63 131 69" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="162" y="55" width="1088" height="34" rx="17" fill="#f1f3f4" />
  <path d="M186 66 V63 A5 5 0 0 1 196 63 V66 M184 66 H198 V78 H184Z" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round" />
  <text x="211" y="77" class="mono">chrome-extension://local-agent</text>
  <circle cx="1358" cy="64" r="2" fill="#64748b" />
  <circle cx="1358" cy="72" r="2" fill="#64748b" />
  <circle cx="1358" cy="80" r="2" fill="#64748b" />
  <path d="M1 98 H1399" stroke="#d7dce2" />

  <!-- Abstract extension runtime -->
  <path d="M1 99 H1399 V696 A23 23 0 0 1 1376 719 H24 A23 23 0 0 1 1 696Z" fill="url(#page)" />
  <text x="700" y="135" text-anchor="middle" class="eyebrow">CHROME EXTENSION</text>
  <text x="700" y="175" text-anchor="middle" class="heading">A durable Agent running locally</text>

  <!-- The faint orbit is the extension boundary, not a process diagram. -->
  <circle cx="700" cy="417" r="177" fill="none" stroke="#e0e7ff" stroke-width="28" />
  <circle cx="700" cy="417" r="177" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="4 12" />

  <!-- State -->
  <path d="M448 417 C500 417 532 417 580 417" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" />
  <circle cx="462" cy="417" r="5" fill="#14b8a6" />
  <g filter="url(#soft-shadow)">
    <circle cx="356" cy="417" r="76" fill="#ffffff" stroke="#99f6e4" stroke-width="2" />
  </g>
  <ellipse cx="356" cy="386" rx="25" ry="9" fill="none" stroke="#0f766e" stroke-width="3" />
  <path d="M331 386 V415 C331 420 342 424 356 424 C370 424 381 420 381 415 V386 M331 400 C331 405 342 409 356 409 C370 409 381 405 381 400" fill="none" stroke="#0f766e" stroke-width="3" />
  <text x="356" y="457" text-anchor="middle" class="label">State</text>

  <!-- Alarm -->
  <path d="M700 319 V294" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
  <circle cx="700" cy="306" r="5" fill="#f97316" />
  <g filter="url(#soft-shadow)">
    <circle cx="700" cy="255" r="65" fill="#ffffff" stroke="#fed7aa" stroke-width="2" />
  </g>
  <circle cx="700" cy="241" r="22" fill="none" stroke="#ea580c" stroke-width="3" />
  <path d="M700 229 V242 L710 249" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="700" y="290" text-anchor="middle" class="label">Alarms</text>

  <!-- Live connection -->
  <path d="M820 417 C868 417 900 417 952 417" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  <circle cx="938" cy="417" r="5" fill="#3b82f6" />
  <g filter="url(#soft-shadow)">
    <circle cx="1044" cy="417" r="76" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
  </g>
  <circle cx="1027" cy="397" r="9" fill="none" stroke="#2563eb" stroke-width="3" />
  <circle cx="1061" cy="397" r="9" fill="none" stroke="#2563eb" stroke-width="3" />
  <path d="M1036 397 H1052 M1030 407 C1036 419 1052 419 1058 407" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
  <text x="1044" y="457" text-anchor="middle" class="label">Live</text>

  <!-- Agent -->
  <g filter="url(#agent-shadow)">
    <circle cx="700" cy="417" r="112" fill="url(#agent)" />
  </g>
  <rect x="666" y="344" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.18" />
  <text x="700" y="361" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="750" letter-spacing="1.4">LOCAL</text>
  <text x="700" y="425" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="35" font-weight="730">Agent</text>
  <path d="M666 452 H734" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />
  <circle cx="700" cy="452" r="5" fill="#ffffff" />

  <!-- One durable idea -->
  <rect x="493" y="610" width="414" height="52" rx="26" fill="#ffffff" stroke="#dbe3ef" filter="url(#soft-shadow)" />
  <circle cx="526" cy="636" r="11" fill="#ffedd5" />
  <path d="M526 629 V636 L531 639" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="700" y="642" text-anchor="middle" class="label">sleep → wake → continue</text>
</svg>
